<style>
/* Layout: the 12-lead strip spans the full width like a printout; the four questions sit below it in a two-column answer sheet. */
:root{
  --paper:#fbf7f6; --surface:#ffffff; --ink:#1f1a1c; --muted:#6d6266; --line:#eadfe0;
  --grid:#f3c9cc; --grid-strong:#e9a3a9; --trace:#b3122e; --trace-soft:#fbe3e6;
  --ok:#1d7a4f; --ok-soft:#e1f3ea; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a5a00; --warn-soft:#fdf1d8;
  --f-display:"Secular One","Assistant",system-ui,sans-serif;
  --f-body:"Assistant",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16141a; --surface:#1f1c23; --ink:#efe9ec; --muted:#a69aa1; --line:#332d36;
  --grid:#3a2a30; --grid-strong:#56353f; --trace:#ff6b81; --trace-soft:#3a1f27;
  --ok:#5fd39b; --ok-soft:#173527; --bad:#ff8a80; --bad-soft:#3d1d1c; --warn:#f2c46b; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16141a; --surface:#1f1c23; --ink:#efe9ec; --muted:#a69aa1; --line:#332d36;
  --grid:#3a2a30; --grid-strong:#56353f; --trace:#ff6b81; --trace-soft:#3a1f27;
  --ok:#5fd39b; --ok-soft:#173527; --bad:#ff8a80; --bad-soft:#3d1d1c; --warn:#f2c46b; --warn-soft:#3a2f17; color-scheme:dark}
html{direction:rtl}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--f-body);}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:clamp(1.7rem,4vw,2.4rem)}
h2{font-size:1.35rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.choice:focus-visible{outline:3px solid var(--trace);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top p{margin:4px 0 0;max-width:60ch}
.trace{display:block;width:100%;height:42px}
.trace path{fill:none;stroke:var(--trace);stroke-width:2;stroke-linejoin:round}

/* mode buttons */
.modes{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600}
.btn.primary{background:var(--trace);border-color:var(--trace);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}

/* lesson grid */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.lesson{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.lesson:hover{border-color:var(--grid-strong)}
.lesson .num{font-family:var(--f-mono);font-size:.8rem;color:var(--trace);letter-spacing:.06em}
.lesson b{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.lesson small{color:var(--muted)}

/* practice view */
.crumbs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumbs .sp{flex:1}
.pill{font-size:.85rem;border-radius:999px;padding:3px 10px;background:var(--trace-soft);color:var(--trace);font-weight:700}
.case{display:flex;flex-direction:column;gap:18px}
@media (max-width:860px){.case{grid-template-columns:minmax(0,1fr)}}
.strip{display:flex;flex-direction:column;gap:10px}
@media (max-width:860px){.strip{position:static}}
.paper{border:1px solid var(--grid-strong);border-radius:var(--r);padding:10px;
  background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;}
.paper img,.paper video{display:block;width:100%;height:auto;border-radius:4px;background:#fff;cursor:zoom-in}
.paper video{cursor:default;background:#000}
.strip .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dx{border:1px dashed var(--grid-strong);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
.dx strong{font-family:var(--f-display);font-weight:400;font-size:1.15rem;direction:ltr}

.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;min-width:0;align-items:start}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.q h3{font-family:var(--f-body);font-weight:700;font-size:1.05rem;line-height:1.45}
.q h3 .k{font-family:var(--f-mono);color:var(--trace);font-weight:500;margin-left:6px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.choice{text-align:right;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.choice:hover:not([disabled]){border-color:var(--grid-strong)}
.choice .mk{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--grid-strong);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:2px}
.choice img{width:100%;border-radius:4px;background:#fff}
.choice.imgc{flex-direction:column;align-items:stretch}
.choice[disabled]{cursor:default}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.right .mk{border-color:var(--ok);background:var(--ok);color:var(--surface)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .mk{border-color:var(--bad);background:var(--bad);color:var(--surface)}
.choice.dim{opacity:.6}
.note{font-size:.92rem;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px}
.verdict{font-weight:700;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--bad)}

.casefoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.score{font-family:var(--f-mono);font-size:1.05rem}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-size:2.6rem;color:var(--trace);line-height:1}

/* lightbox */
.lb{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));gap:10px}
.lb .bar2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb .view{flex:1;overflow:auto;border:1px solid var(--grid-strong);border-radius:var(--r);background:#fff;touch-action:pan-x pan-y pinch-zoom}
.lb img{max-width:none;display:block}
[hidden]{display:none!important}
.why{font-size:.95rem;line-height:1.5;border-top:1px dashed var(--line);padding-top:8px}
.find{margin:6px 0 0;padding-right:18px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem;direction:ltr;justify-content:flex-end}
.links a{color:var(--trace)}
.chap{display:flex;flex-direction:column;gap:10px}
.chap h2 .n{color:var(--trace);font-family:var(--f-mono);font-size:1rem;margin-left:8px}
.who{font-weight:600}
.toggle{display:flex;align-items:center;gap:8px;font-size:.95rem}
.foot{font-size:.85rem;color:var(--muted);max-width:75ch}
@media (prefers-reduced-motion:no-preference){.choice,.lesson,.btn{transition:border-color .15s,background-color .15s}}
</style>

lmonale) + Sinus tachycardia", "find": ["גלי P גבוהים ומחודדים ב-II, III, aVF (כ-2.5–3 מ\"מ)", "קצב סינוס כ-105", "QRS צר"], "links": [{"t": "P-wave: P mitrale, P pulmonale", "u": "https://ecgwaves.com/articles/p-wave-on-ecg-morphology-normal-values-and-abnormalities"}], "img": "ecg/ecg_5955.png", "qs": [{"id": "5955-0", "q": "מה החריג בגלי ה-P?", "ch": ["רחבים ומחורצים ב-II", "חסרים", "שליליים ב-II", "גבוהים ומחודדים ב-II, III, aVF"], "a": 3, "why": "גל P בגובה של 2.5 מ\"מ ומעלה בלידים התחתונים נקרא P pulmonale ומרמז על הגדלה או עומס של העלייה הימנית."}, {"id": "5955-1", "q": "למה הגדלת העלייה הימנית משנה את הגובה של P ולא את רוחבו?", "ch": ["זה לא נכון", "כי העלייה הימנית לא נראית באק\"ג", "כי הצומת הסינוסי בשמאל", "כי העלייה הימנית מופעלת ראשונה, וההגדלה מוסיפה וולטאז' לחלק הראשון של ה-P"], "a": 3, "why": "החלק הראשון של ה-P הוא העלייה הימנית והחלק השני הוא השמאלית. הגדלה ימנית מגביהה את החלק הראשון, והגדלה שמאלית מאריכה ומחרצת את ה-P (P mitrale)."}, {"id": "5955-2", "q": "מה הסיבה הקלאסית ל-P pulmonale?", "ch": ["היפרקלמיה", "יל\"ד מערכתי", "מחלת ריאות כרונית (COPD) / יתר לחץ דם ריאתי", "היצרות מיטרלית"], "a": 2, "why": "עומס על החדר הימני והעלייה הימנית, כמו ב-COPD, PE חוזרים, PHTN או מחלה מולדת, גורם ל-P pulmonale. היצרות מיטרלית גורמת ל-P mitrale."}, {"id": "5955-3", "q": "איך ייראה P mitrale (הגדלת עלייה שמאלית)?", "ch": ["P גבוה ומחודד", "P רחב (≥0.12 ש') ומחורץ ב-II, עם רכיב שלילי עמוק ב-V1", "אין P", "P הפוך ב-aVR"], "a": 1, "why": "העלייה השמאלית המוגדלת מאריכה את החלק השני של ה-P, ולכן ה-P רחב עם שני דבשות ב-II ועם סוף שלילי רחב ב-V1."}]}, {"n": 23, "id": 12899, "ch": 6, "who": "אישה בת 67, כאב לוחץ בחזה", "dx": "Inferior STEMI (חריף)", "find": ["עליות ST ב-II, III, aVF", "צניחת ST רציפרוקלית ב-aVL", "קצב סינוס כ-73"], "links": [{"t": "STEMI: ECG criteria", "u": "https://ecgwaves.com/articles/ecg-criteria-for-stemi-st-elevation-myocardial-infarction"}, {"t": "ST elevation: differential diagnoses", "u": "https://ecgwaves.com/articles/ecg-st-elevation-segment-ischemia-myocardial-infarction-stemi"}], "img": "ecg/ecg_12899.png", "qs": [{"id": "12899-0", "q": "באילו לידים יש עליות ST?", "ch": ["V1–V4", "I, aVL, V5–V6", "II, III, aVF", "aVR בלבד"], "a": 2, "why": "עליות ST בשני לידים רציפים ומעלה בקיר התחתון. aVL מראה צניחה, וזו התמונה הרציפרוקלית הקלאסית."}, {"id": "12899-1", "q": "מה המשמעות של הצניחה ב-aVL?", "ch": ["תמונה רציפרוקלית, שמחזקת את האבחנה של אוטם ולא של פריקרדיטיס או עליה שפירה", "אוטם לטרלי נפרד בוודאות", "WPW", "שלילת STEMI"], "a": 0, "why": "aVL נמצא בצד הנגדי לקיר התחתון. בפריקרדיטיס ובעליה שפירה לרוב אין צניחות רציפרוקליות (מלבד aVR)."}, {"id": "12899-2", "q": "איזה עורק חסום לרוב באוטם תחתון?", "ch": ["LMCA", "RCA (בכ-80%), ולעיתים LCx", "Diagonal", "LAD"], "a": 1, "why": "RCA מספק את הקיר התחתון ברוב האנשים (right dominance). כשעליית ה-ST ב-III גבוהה מזו ב-II, וכשיש צניחה ב-I, זה תומך ב-RCA."}, {"id": "12899-3", "q": "מה חשוב לבצע לפני ניטרטים באוטם תחתון?", "ch": ["בדיקת סוכר בלבד", "צילום חזה", "לידים ימניים (V4R) ומדידת ל\"ד, כדי לשלול אוטם של החדר הימני", "שום דבר"], "a": 2, "why": "באוטם של החדר הימני המטופל תלוי בפרה-לואד. ניטרטים עלולים לגרום לירידה חדה בל\"ד. עליית ST של 1 מ\"מ ומעלה ב-V4R מחשידה."}]}, {"n": 24, "id": 1063, "ch": 6, "who": "גבר בן 69, כאב בחזה", "dx": "STEMI קדמי נרחב עם עליות ST גם בקיר התחתון", "find": ["עליות ST מאסיביות ב-V1–V4 (tombstoning)", "עליות ST גם ב-II, III, aVF", "קצב סינוס כ-88"], "links": [{"t": "STEMI: ECG criteria", "u": "https://ecgwaves.com/articles/ecg-criteria-for-stemi-st-elevation-myocardial-infarction"}], "img": "ecg/ecg_1063.png", "qs": [{"id": "1063-0", "q": "איפה עליות ה-ST הבולטות ביותר?", "ch": ["אין עליות", "V1–V4", "V5–V6 בלבד", "aVR"], "a": 1, "why": "העליות בלידי החזה הקדמיים ענקיות, ה-ST מתמזג עם ה-T ונוצר מראה של \"מצבה\" (tombstone). זה אוטם קדמי נרחב."}, {"id": "1063-1", "q": "העליות קיימות גם ב-II, III, aVF. מה ההסבר האפשרי?", "ch": ["היפרקלמיה", "פריקרדיטיס בוודאות", "LAD ארוך שעוטף את קודקוד הלב (wrap-around) ומספק גם את הקיר התחתון       const v=el.querySelector('.verdict');v.hidden=false;el.querySelector('.why').hidden=false;
      if(a===q.a){v.textContent='נכון';v.className='verdict ok'}else{v.textContent='לא נכון. התשובה הנכונה מסומנת בירוק';v.className='verdict no'}};
    el.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const a=+b.dataset.i;session.answers[q.id]=a;store.res[q.id]=a===q.a?1:0;save();paint();score();
      if(c.qs.every(x=>session.answers[x.id]!==undefined)){$('#dx').hidden=false;$('#showdx').hidden=true}});
    paint();});
  score();
  $('#back').onclick=goHome;if($('#share'))$('#share').onclick=e=>copyLink(e.currentTarget);$('#prev').onclick=()=>{session.i--;renderCase();scrollTo(0,0)};
  $('#next').onclick=()=>{if(session.i<n-1){session.i++;renderCase();scrollTo(0,0)}else summary()};
  $('#showdx').onclick=e=>{$('#dx').hidden=false;e.target.hidden=true};
  const open=()=>openLb(c.img);$('#zoom').onclick=open;$('#stripimg').onclick=open;
}
function tally(cases){let ok=0,tot=0;cases.forEach(c=>c.qs.forEach(q=>{const a=session.answers[q.id];if(a!==undefined){tot++;if(a===q.a)ok++}}));return{ok,tot}}
function score(){const t=tally(session.cases);$('#sc').textContent=`${t.ok} / ${t.tot} נכון בסבב`}
function summary(){const t=tally(session.cases),all=session.cases.reduce((a,c)=>a+c.qs.length,0);
  const wrong=session.cases.filter(c=>c.qs.some(q=>session.answers[q.id]!==undefined&&session.answers[q.id]!==q.a));
  app.innerHTML=`<div class="crumbs"><button class="btn ghost" id="back" type="button">→ כל הפרקים</button><span class="pill">${esc(session.title)}</span></div>
  <section class="summary"><div class="muted">סיכום הסבב</div><div class="big mono">${t.tot?Math.round(t.ok/t.tot*100):0}%</div>
   <div>${t.ok} נכונות מתוך ${t.tot} שנענו (${all} שאלות בסבב).</div>
   <div class="modes"><button class="btn primary" id="again" type="button" ${wrong.length?'':'disabled'}>לתרגל שוב את ${wrong.length} המקרים עם הטעויות</button><button class="btn" id="home2" type="button">חזרה לבחירת פרק</button></div></section>`;
  $('#back').onclick=goHome;$('#home2').onclick=goHome;$('#again').onclick=()=>start('חזרה על טעויות מהסבב',wrong);
}
let zoom=1;const lb=$('#lb'),lbi=$('#lbi');
function setZ(z){zoom=Math.min(4,Math.max(.3,z));lbi.style.width=(lbi.naturalWidth*zoom)+'px';$('#lbz').textContent=Math.round(zoom*100)+'%'}
function openLb(src){lb.hidden=false;lbi.onload=()=>setZ(($('#lbv').clientWidth-4)/lbi.naturalWidth*1.6);lbi.src=src;if(lbi.complete&&lbi.naturalWidth)lbi.onload()}
$('#lbc').onclick=()=>lb.hidden=true;$('#zin').onclick=()=>setZ(zoom*1.25);$('#zout').onclick=()=>setZ(zoom/1.25);
addEventListener('keydown',e=>{if(e.key==='Escape')lb.hidden=true});
function goHome(){if(location.hash&&location.hash!=='#')location.hash='';else home()}
route();
</script>
